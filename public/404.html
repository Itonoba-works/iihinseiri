<head>

<!-- このファイルは削除しないこと。
     これが無いと Cloudflare Pages は「SPA」と判断し、
     存在しないURLでもトップページを 200 で返してしまう（＝ソフト404）。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

  body { margin:0; background:#fff; color:var(--ink); line-height:1.8;
         font-family:"Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:56px 20px 72px; }
  .brand { font-size:15px; font-weight:700; }
  .brand a { color:var(--ink); text-decoration:none; }
  h1 { margin:34px 0 10px; font-size:26px; line-height:1.5; }
  p { margin:0 0 18px; color:var(--muted); font-size:15px; }
  .code { font-size:13px; letter-spacing:.04em; }
  ul { margin:28px 0 0; padding:24px 0 0; border-top:1px solid var(--line); list-style:none; }
  li { margin:0 0 10px; font-size:15px; }
  a { color:var(--link); text-decoration:none; }
  a:hover { color:var(--link-hover); text-decoration:underline; }
</style>
</head>
